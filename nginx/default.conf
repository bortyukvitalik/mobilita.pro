server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32k;

    # ── Security-заголовки ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # script/style 'unsafe-inline' нужны из-за инлайн-скриптов и onclick на странице;
    # ключевое — connect-src 'self': скомпрометированный сторонний код не сольёт данные наружу.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    # HSTS — раскомментировать ПОСЛЕ включения HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API → бекенд (FastAPI). Реальный IP клиента прокидываем для rate-limit.
    location /api/ {
        # Резолвим имя api через встроенный DNS Docker (127.0.0.11) НА КАЖДЫЙ запрос:
        # переменная в proxy_pass отключает кеширование IP при старте. Иначе после
        # пересборки api-контейнера (новый IP) nginx отдаёт 502, пока его не перезапустишь.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_backend "api";
        proxy_pass http://$api_backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Данные калькулятора не кэшируем (обновляются ежеквартально)
    location = /cert_amounts.json {
        add_header Cache-Control "no-cache";
    }

    # Статика лендинга
    location / {
        try_files $uri /index.html;
    }
}
